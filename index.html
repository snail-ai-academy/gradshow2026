<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首届蜗牛AI毕业展 · 2026.09.26</title>
<style>
  :root{
    --ink:#1A1A2E; --ink2:#2A2A40; --ink3:#6A6A85;
    --paper:#FCFCFA; --paper2:#F5F4EE; --paper3:#E8E7E0;
    --accent:#FF5B1F; --accent2:#E84A0F; --accent-warm:#FFF5EE;
    --gold:#D4A547; --gold-light:#FBF3DE;
    --green:#2D6A4F; --green-light:#E8F3EC;
    --line:rgba(26,26,46,.08);
    --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-snap-type:y mandatory;}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;background:var(--paper);
  }

  /* ===== 整页滚动版式：一屏一节，往下连续滚动 ===== */
  .slide{
    height:100vh;height:100dvh;
    scroll-snap-align:start;scroll-snap-stop:always;
    overflow:hidden;
    display:flex;flex-direction:column;
    padding:clamp(28px,4.5vh,56px) clamp(40px,6vw,110px);
    padding-top:clamp(48px,8vh,84px);
    padding-bottom:clamp(56px,9vh,92px);
    position:relative;
  }
  .slide.active{animation:riseIn .55s ease both;}
  @keyframes riseIn{from{opacity:.35;transform:translateY(26px);}to{opacity:1;transform:none;}}

  /* ===== 通用元素 ===== */
  .chip{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--accent);color:#fff;border-radius:100px;
    padding:7px 18px;font-size:clamp(12px,1.6vh,15px);font-weight:700;letter-spacing:.12em;
    width:fit-content;margin-bottom:clamp(10px,2.2vh,22px);
  }
  .chip.gold{background:var(--gold);color:#3d2f0a;}
  .chip.green{background:var(--green);}
  .slide-no{
    position:absolute;bottom:clamp(16px,3vh,30px);right:clamp(24px,3vw,48px);
    font-size:clamp(11px,1.5vh,14px);color:var(--ink3);font-weight:600;letter-spacing:.08em;
  }
  .brandmark{
    position:absolute;top:clamp(18px,3.2vh,34px);right:clamp(24px,3vw,48px);
    font-size:clamp(13px,1.8vh,17px);font-weight:800;color:var(--ink);opacity:.95;letter-spacing:.04em;
    display:flex;align-items:center;gap:9px;
  }
  /* 官网 logo 芯片（黑底金字，来自 snailai.au） */
  .logo-chip{
    height:1.9em;width:auto;border-radius:7px;display:inline-block;vertical-align:-0.55em;
    box-shadow:0 2px 8px rgba(26,26,46,.18);
  }
  .logo-chip.lg{height:clamp(72px,12vh,120px);border-radius:14px;box-shadow:0 10px 30px rgba(26,26,46,.22);}
  h1.big{font-size:clamp(40px,8.5vh,84px);font-weight:900;line-height:1.14;letter-spacing:.01em;}
  h2.title{font-size:clamp(26px,4.6vh,44px);font-weight:900;line-height:1.2;}
  .accentbar{width:64px;height:8px;border-radius:8px;background:var(--accent);margin:clamp(8px,1.8vh,18px) 0;}
  .sub{color:var(--ink3);font-size:clamp(14px,2.1vh,19px);line-height:1.7;}
  .scrolldown{
    position:absolute;bottom:clamp(14px,2.6vh,26px);left:50%;transform:translateX(-50%);
    color:var(--ink3);font-size:clamp(11px,1.5vh,13px);font-weight:700;letter-spacing:.25em;
    display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.75;user-select:none;
  }
  .scrolldown::after{
    content:"";width:2px;height:clamp(16px,3vh,28px);
    background:linear-gradient(var(--accent),transparent);
    animation:drip 1.6s ease-in-out infinite;
  }
  @keyframes drip{0%{transform:scaleY(.2);transform-origin:top;opacity:.3;}55%{transform:scaleY(1);opacity:1;}100%{transform:scaleY(.2);transform-origin:bottom;opacity:.3;}}

  /* ===== 封面 ===== */
  .cover{justify-content:center;align-items:flex-start;background:
    radial-gradient(900px 520px at 88% -10%, rgba(255,91,31,.14), transparent 62%),
    radial-gradient(700px 460px at -6% 108%, rgba(212,165,71,.16), transparent 60%),
    var(--paper);}
  .cover .kicker{font-size:clamp(15px,2.4vh,22px);font-weight:700;color:var(--accent);letter-spacing:.35em;margin-bottom:clamp(10px,2vh,20px);}
  .cover .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:clamp(20px,4vh,40px);}
  .cover .meta .pill{border:1.5px solid var(--ink);border-radius:100px;padding:9px 22px;font-size:clamp(13px,1.9vh,17px);font-weight:600;background:#fff;}
  .cover .meta .pill.solid{background:var(--ink);color:#fff;border-color:var(--ink);}
  .cover .footline{margin-top:clamp(26px,5.5vh,54px);color:var(--ink3);font-size:clamp(13px,1.9vh,17px);letter-spacing:.06em;}

  /* ===== 视频节 ===== */
  .video-slide{background:#0E0E16;}
  .video-slide .vhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:clamp(10px,2vh,20px);}
  .video-slide .vtitle{color:#fff;font-size:clamp(18px,3vh,28px);font-weight:800;}
  .video-slide .vsub{color:rgba(255,255,255,.55);font-size:clamp(12px,1.7vh,15px);margin-top:4px;font-weight:500;}
  /* 影院式舞台：16:9 视频撑满，舞台收紧贴合视频 */
  .vstage{
    flex:1;min-height:0;position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .vbg{display:none;}
  .vwrap{
    position:relative;height:100%;aspect-ratio:16/9;max-width:100%;
    border-radius:16px;overflow:hidden;background:#000;
    box-shadow:0 24px 70px rgba(0,0,0,.5);
  }
  .vwrap video{width:100%;height:100%;object-fit:cover;display:block;outline:none;}
  /* 课程视频（DD05，1176x784）保持原始比例嵌入，不裁切不变形 */
  #course-video-wrap{aspect-ratio:1176/784;}
  #course-video-el{object-fit:contain;}
  .video-slide .slide-no{color:rgba(255,255,255,.45);}

  /* ===== 学生节通用 ===== */
  .stu-head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;}
  .stu-name{font-size:clamp(34px,6vh,58px);font-weight:900;line-height:1;}
  .stu-en{font-size:clamp(15px,2.2vh,20px);color:var(--ink3);font-weight:700;letter-spacing:.06em;padding-bottom:6px;}
  .stu-proj-chip{
    display:inline-block;background:var(--accent-warm);color:var(--accent2);
    border:1.5px solid rgba(255,91,31,.35);border-radius:12px;
    padding:8px 16px;font-weight:800;font-size:clamp(14px,2vh,18px);margin-bottom:clamp(10px,2vh,18px);
  }
  .stu-grid{flex:1;display:grid;grid-template-columns:minmax(240px,30%) 1fr;gap:clamp(20px,3.2vw,52px);min-height:0;margin-top:clamp(14px,2.6vh,26px);}
  .photocard{
    background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);
    padding:12px;display:flex;flex-direction:column;gap:12px;min-height:0;
  }
  .photocard .ph{flex:1;min-height:0;border-radius:12px;overflow:hidden;background:var(--paper2);position:relative;}
  .photocard .ph img{width:100%;height:100%;object-fit:contain;display:block;background:#faf9f4;}
  .photocard .ph.transparent img{object-fit:contain;background:
    linear-gradient(45deg,#f6f5ef 25%,transparent 25%,transparent 75%,#f6f5ef 75%),
    linear-gradient(45deg,#f6f5ef 25%,#faf9f4 25%,#faf9f4 75%,#f6f5ef 75%);background-size:22px 22px;background-position:0 0,11px 11px;}
  .photocard .tag{
    position:absolute;left:10px;bottom:10px;background:rgba(26,26,46,.82);color:#fff;
    font-size:clamp(10px,1.4vh,13px);font-weight:700;padding:4px 12px;border-radius:100px;letter-spacing:.1em;
  }
  .stu-info{display:flex;flex-direction:column;min-height:0;gap:clamp(8px,1.6vh,16px);}
  .stu-info .role{color:var(--ink3);font-weight:700;font-size:clamp(13px,1.9vh,16px);letter-spacing:.08em;}
  .story{font-size:clamp(14.5px,2.15vh,19px);line-height:1.85;color:var(--ink2);}
  .story b{color:var(--ink);}
  .story .hl{color:var(--accent2);font-weight:800;}
  .quotebox{
    margin-top:auto;background:var(--paper2);border-left:6px solid var(--accent);
    border-radius:0 14px 14px 0;padding:14px 20px;font-size:clamp(13.5px,2vh,17.5px);
    color:var(--ink2);font-weight:600;line-height:1.6;
  }

  /* ===== 作品节 ===== */
  .works-grid{flex:1;display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(20px,3vw,50px);margin-top:clamp(14px,2.6vh,26px);min-height:0;}
  .works-main{display:flex;flex-direction:column;gap:clamp(10px,2vh,18px);min-height:0;}
  .works-desc{font-size:clamp(15px,2.3vh,20px);line-height:1.85;color:var(--ink2);}
  .featurelist{display:flex;flex-direction:column;gap:clamp(8px,1.5vh,14px);}
  .feature{
    display:flex;gap:14px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);
    border-radius:14px;padding:clamp(10px,1.8vh,16px) clamp(14px,2vw,20px);
  }
  .feature .num{
    flex:none;width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
  }
  .feature .ft{font-weight:800;font-size:clamp(13.5px,2vh,17px);margin-bottom:3px;}
  .feature .fd{color:var(--ink3);font-size:clamp(12.5px,1.8vh,15.5px);line-height:1.6;}
  .feature.musicrow{cursor:pointer;border:1.5px solid var(--accent);background:var(--accent-warm);align-items:center;user-select:none;}
  .feature.musicrow .num{background:var(--accent);}
  .feature.musicrow .playbtn{
    flex:none;margin-left:auto;width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;
  }
  .feature.musicrow.playing{background:#FFE8DB;}
  .feature.musicrow.playing .playbtn{animation:mpulse 1.2s ease-in-out infinite;}
  @keyframes mpulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
  .statcard{
    background:var(--ink);color:#fff;border-radius:var(--radius);padding:clamp(18px,3vh,30px);
    display:flex;flex-direction:column;gap:clamp(10px,2vh,18px);justify-content:center;
  }
  .statcard .row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .statcard .v{font-size:clamp(26px,4.6vh,44px);font-weight:900;color:var(--gold);line-height:1;}
  .statcard .k{font-size:clamp(12.5px,1.8vh,16px);color:rgba(255,255,255,.75);font-weight:600;}
  .statcard .divider{height:1px;background:rgba(255,255,255,.14);}

  /* ===== 总览节 ===== */
  .ov-grid{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:clamp(10px,1.8vh,18px);margin-top:clamp(14px,2.6vh,26px);min-height:0;}
  .ov-card{
    background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:clamp(10px,1.8vh,16px);
    display:flex;flex-direction:column;gap:6px;justify-content:center;position:relative;overflow:hidden;
  }
  .ov-card .idx{position:absolute;top:10px;right:14px;font-size:clamp(18px,3vh,28px);font-weight:900;color:var(--paper3);}
  .ov-card .nm{font-weight:900;font-size:clamp(15px,2.3vh,21px);}
  .ov-card .pj{color:var(--ink3);font-size:clamp(11px,1.6vh,14px);font-weight:600;line-height:1.45;}
  .ov-card.video::after{
    content:"▶ 有视频";position:absolute;bottom:10px;left:12px;
    background:var(--accent);color:#fff;font-size:clamp(9px,1.3vh,11px);font-weight:800;
    padding:3px 10px;border-radius:100px;letter-spacing:.05em;
  }

  /* ===== 「到底教什么」课程视频屏 · 占位 ===== */
  .vplaceholder{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:
      repeating-linear-gradient(135deg,#14141f 0 26px,#171722 26px 52px);
    text-align:center;padding:24px;
  }
  .vplaceholder.hidden{display:none;}
  .ph-emoji{font-size:clamp(40px,7vh,68px);line-height:1;filter:drop-shadow(0 8px 24px rgba(255,91,31,.35));}
  .ph-title{color:#fff;font-weight:900;font-size:clamp(20px,3.6vh,32px);letter-spacing:.12em;}
  .ph-desc{color:rgba(255,255,255,.55);font-size:clamp(12px,1.9vh,16px);line-height:1.8;font-weight:600;}
  .ph-desc b{color:var(--gold);font-weight:800;}

  /* ===== Robin / 课程节 ===== */
  .course-grid{flex:1;display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(24px,3.4vw,56px);margin-top:clamp(16px,3vh,28px);min-height:0;align-items:stretch;}
  .pricecard{
    background:linear-gradient(160deg,var(--ink) 0%,#232338 100%);color:#fff;border-radius:22px;
    padding:clamp(22px,4vh,42px);display:flex;flex-direction:column;gap:clamp(10px,2vh,18px);
  }
  .pricecard .cname{font-size:clamp(20px,3.4vh,30px);font-weight:900;}
  .pricecard .price{font-size:clamp(38px,7vh,66px);font-weight:900;color:var(--gold);line-height:1;}
  .pricecard .per{color:rgba(255,255,255,.65);font-size:clamp(13px,2vh,17px);}
  .checklist{display:flex;flex-direction:column;gap:clamp(8px,1.6vh,15px);justify-content:center;}
  .checklist .it{display:flex;gap:12px;align-items:flex-start;font-size:clamp(13px,1.9vh,16.5px);line-height:1.6;color:var(--ink2);}
  .checklist .it::before{content:"✓";flex:none;width:23px;height:23px;border-radius:7px;background:var(--green-light);color:var(--green);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:12.5px;margin-top:2px;}
  .cta-big{
    background:var(--accent);color:#fff;text-align:center;border-radius:16px;
    padding:clamp(12px,2vh,18px);font-size:clamp(14px,2.1vh,19px);font-weight:900;letter-spacing:.04em;
  }
  .cta-big small{display:block;font-size:.55em;font-weight:600;opacity:.85;margin-top:4px;letter-spacing:.1em;}
  .buy-row{margin-top:auto;display:flex;gap:clamp(14px,2vw,26px);align-items:stretch;}
  .buy-row .cta-big{flex:1;display:flex;flex-direction:column;justify-content:center;margin-top:0;}
  .qrcard{
    flex:none;background:#fff;border-radius:16px;padding:clamp(8px,1.4vh,12px);
    display:flex;flex-direction:column;align-items:center;gap:5px;
  }
  .qrcard img{width:clamp(200px,28vh,300px);height:auto;display:block;border-radius:8px;}
  .qrcard small{font-size:clamp(10px,1.5vh,12.5px);font-weight:800;color:var(--ink);letter-spacing:.06em;}

  /* ===== 结尾 ===== */
  .end{justify-content:center;align-items:center;text-align:center;background:
    radial-gradient(1000px 600px at 50% 120%, rgba(255,91,31,.18), transparent 65%),var(--ink);color:#fff;}
  .end h1{font-size:clamp(40px,9vh,88px);font-weight:900;letter-spacing:.02em;}
  .end .sub2{color:rgba(255,255,255,.65);margin-top:clamp(14px,3vh,28px);font-size:clamp(15px,2.4vh,22px);line-height:1.8;}
  .end .url{margin-top:clamp(22px,4.5vh,44px);background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);border-radius:100px;padding:12px 34px;font-size:clamp(15px,2.4vh,22px);font-weight:800;color:var(--gold);letter-spacing:.06em;}

  /* ===== 滚动导航 ===== */
  #topbar{position:fixed;top:0;left:0;right:0;height:5px;background:rgba(26,26,46,.08);z-index:60;}
  #progress{height:100%;width:0;background:var(--accent);transition:width .15s linear;}
  #counter{
    position:fixed;top:16px;left:22px;z-index:61;
    background:rgba(26,26,46,.85);color:#fff;border-radius:100px;padding:6px 18px;
    font-size:13px;font-weight:700;letter-spacing:.1em;user-select:none;
  }
  #hint{
    position:fixed;bottom:14px;left:22px;z-index:61;color:rgba(26,26,46,.4);
    font-size:12px;font-weight:600;letter-spacing:.05em;user-select:none;pointer-events:none;
  }
</style>
</head>

const slides = [...document.querySelectorAll('.slide')];
slides.forEach(s=>{const no=document.createElement('div');no.className='slide-no';s.appendChild(no);});

/* ================= 滚动逻辑 ================= */
let cur = 0;
const counterEl = document.createElement('div');
counterEl.id='counter';document.body.appendChild(counterEl);
const hintEl = document.createElement('div');
hintEl.id='hint';hintEl.textContent='滚轮 / ↓↑ / 空格 整页滚动 · F 全屏 · 视频滚出自动暂停';
document.body.appendChild(hintEl);
const bar = document.createElement('div');
bar.id='topbar';bar.innerHTML='<div id="progress"></div>';
document.body.appendChild(bar);
const progEl = bar.querySelector('#progress');

const pad=n=>n<10?'0'+n:''+n;
function updateActive(){
  const mid = window.scrollY + window.innerHeight/2;
  let best=0;
  slides.forEach((s,i)=>{ if(s.offsetTop <= mid) best=i; });
  if(best!==cur){
    slides[cur] && slides[cur].classList.remove('active');
    cur=best;
    slides[cur].classList.add('active');
  }
  counterEl.textContent = pad(cur+1)+' / '+pad(slides.length);
  progEl.style.width = ((cur+1)/slides.length*100)+'%';
}
window.addEventListener('scroll', updateActive, {passive:true});
window.addEventListener('resize', updateActive);

/* 视频滚出屏幕自动暂停（滚动版式的关键行为）；音乐同理 */
const vio = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    const v=e.target;
    if(!e.isIntersecting && v.pause && !v.paused) v.pause();
    if(!e.isIntersecting && window.__mAudio && v.contains && v.contains(window.__mAudio) && !window.__mAudio.paused){
      window.__mAudio.pause(); resetMusicRow();
    }
  });
},{threshold:.25});
document.querySelectorAll('video').forEach(v=>vio.observe(v));
document.querySelectorAll('.musicrow').forEach(el=>vio.observe(el));

/* Maureen 音乐：点击播放 / 再点暂停（单例音频） */
window.__mAudio=null; window.__mRow=null;
function toggleMusic(row){
  if(!window.__mAudio){
    window.__mAudio=new Audio(row.dataset.src);
    window.__mAudio.addEventListener('ended',()=>{resetMusicRow();});
  }
  window.__mRow=row;
  const a=window.__mAudio;
  if(a.paused){
    a.play().catch(err=>console.warn('音频播放失败:',err));
    row.classList.add('playing');
    row.querySelector('.mstat').textContent='♪ 正在播放 · 再点暂停';
    row.querySelector('.playbtn').textContent='❚❚';
  }else{
    a.pause();
    resetMusicRow();
  }
}
function resetMusicRow(){
  if(window.__mRow){
    window.__mRow.classList.remove('playing');
    const ms=window.__mRow.querySelector('.mstat'); if(ms) ms.textContent='▶ 点击播放';
    const pb=window.__mRow.querySelector('.playbtn'); if(pb) pb.textContent='▶';
  }
}

/* 课程视频占位检测：文件就位 → 隐藏占位层正常播放 */
(function(){
  const el=document.getElementById('course-video-el');
  const ph=document.getElementById('course-video-ph');
  if(!el||!ph)return;
  el.addEventListener('loadeddata',()=>ph.classList.add('hidden'));
  el.addEventListener('canplay',()=>ph.classList.add('hidden'));
  el.addEventListener('error',()=>{ph.classList.remove('hidden');el.removeAttribute('controls');});
})();

/* 键盘：整页逐屏滚动 */
function snapTo(i){
  i=Math.max(0,Math.min(slides.length-1,i));
  slides[i].scrollIntoView({behavior:'smooth'});
}
document.addEventListener('keydown',e=>{
  if(['ArrowDown','PageDown',' ','ArrowRight'].includes(e.key)){e.preventDefault();snapTo(cur+1);}
  else if(['ArrowUp','PageUp','ArrowLeft'].includes(e.key)){e.preventDefault();snapTo(cur-1);}
  else if(e.key==='Home'){e.preventDefault();snapTo(0);}
  else if(e.key==='End'){e.preventDefault();snapTo(slides.length-1);}
  else if(e.key==='f'||e.key==='F'){
    if(!document.fullscreenElement){document.documentElement.requestFullscreen();}
    else{document.exitFullscreen();}
  }
});
updateActive();
</script>
